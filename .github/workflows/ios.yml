name: iOS

# Собрать приложение для симулятора, запустить его и снять экран.
# Нужен macOS: Kotlin/Native для Apple и Xcode работают только там.
on:
  push:
    branches: [kmp, main]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Общий код без привязки к платформе
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileCommonMainKotlinMetadata --no-daemon

      - name: Framework для симулятора
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon

      - name: Положить framework туда, где его ищет Xcode
        run: |
          DEST="shared/build/xcode-frameworks/Debug/iphonesimulator"
          mkdir -p "$DEST"
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework "$DEST/"

      - name: Сгенерировать Xcode-проект
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Собрать приложение
        run: |
          cd iosApp
          xcodebuild build \
            -project Kopeechka.xcodeproj \
            -scheme Kopeechka \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Запустить на симуляторе и снять экран
        run: |
          set -x
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find iosApp/build/Build/Products -name "Kopeechka.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" app.kopeechka.finance
          sleep 15
          mkdir -p artifacts
          xcrun simctl io "$DEVICE" screenshot artifacts/home.png
          # второй кадр после перехода в отчёты — проверяем, что интерфейс живой
          xcrun simctl io "$DEVICE" screenshot artifacts/after-launch.png

      - name: Забрать скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: artifacts/
          if-no-files-found: warn

      - name: Забрать логи симулятора при неудаче
        if: failure()
        run: xcrun simctl spawn booted log collect --output artifacts/sim-logs || true
