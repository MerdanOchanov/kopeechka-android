name: Android

# Проверка общего кода и сборка APK. Нужна не только для релизов:
# когда на рабочей машине ломается Gradle, это единственный способ
# убедиться, что код вообще компилируется.
on:
  push:
    branches: [main, kmp]
    paths:
      - 'shared/**'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Общий код без привязки к платформе
        run: |
          chmod +x gradlew
          ./gradlew :shared:compileCommonMainKotlinMetadata --no-daemon

      - name: Собрать APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Забрать APK
        uses: actions/upload-artifact@v4
        with:
          name: kopeechka-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
